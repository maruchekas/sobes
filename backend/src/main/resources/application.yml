spring:
  application:
    name: sobes-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sobes}
    username: ${DB_USER:sobes}
    password: ${DB_PASSWORD:sobes}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # В текстах вопросов встречаются ${...} (шаблоны Kotlin/Java) — не трогаем их.
    placeholder-replacement: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ru.sobes: INFO
