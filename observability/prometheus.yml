global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sobes-backend
    metrics_path: /actuator/prometheus
    # backend на хосте (systemd-юнит или docker-network); из контейнера хост = host.docker.internal на macOS / 172.17.0.1 на Linux
    static_configs:
      - targets: ["${SOBES_BACKEND_TARGET:-host.docker.internal:8080}"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
